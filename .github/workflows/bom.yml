name: Update BOM data

on:
  schedule:
    # Every two hours. GitHub runs cron in UTC and free runners can be a few
    # minutes late, which does not matter for a forecast.
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      force_tides:
        description: 'Re-download tide predictions even if the current ones are still good'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bom-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Fetch from the Bureau
        run: python scripts/fetch_bom.py ${{ inputs.force_tides && '--force-tides' || '' }}

      - name: Commit if anything changed
        run: |
          git config user.name  "bom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "BOM data $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
