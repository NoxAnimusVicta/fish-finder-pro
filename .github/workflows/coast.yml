name: Build coastline

# One-off (or whenever the ABS boundaries change): writes data/coast.json,
# the land outline the swell map clips to.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and pack the coastline
        run: python scripts/build_coast.py

      - name: Commit if anything changed
        run: |
          git config user.name  "coast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coast.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Coastline outline from ABS ASGS 2021 [skip ci]"
            git push
          fi
